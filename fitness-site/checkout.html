<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدفع | جمال موسى FITNESS</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="nav"><div class="navin"><a class="logo" href="index.html">جمال موسى <span>FITNESS</span></a><a class="btn" href="plans.html">الاشتراكات</a></div></header><main class="container"><section class="formbox reveal"><h1>إتمام الاشتراك</h1><p id="info" style="color:var(--muted);line-height:1.8;margin-bottom:20px">جاري تحميل الخطة...</p><button id="pay" class="btn gold">المتابعة للدفع</button><div id="m" class="msg"></div></section></main><script src="assets/app.js"></script><script>
let s,pid=new URLSearchParams(location.search).get("plan"),plan=null;(async()=>{s=await site();plan=(s.plans||[]).find(p=>String(p.id)===String(pid));$("#info").textContent=plan?`${plan.name||plan.title||"الخطة"} — ${plan.price??"—"} ${plan.currency||"جنيه"}`:"الخطة غير موجودة"})();$("#pay").onclick=async()=>{let m=$("#m");m.className="msg";try{if(!plan)throw Error("اختر خطة صحيحة");let d=await api("/api/checkout",{method:"POST",body:JSON.stringify({planId:plan.id,paymentMethod:"paymob"})});if(d.redirectUrl)location.href=d.redirectUrl;else if(d.url)location.href=d.url;else if(d.payment_url)location.href=d.payment_url;else location.href="payment-complete.html"}catch(e){m.textContent=e.message;m.className="msg err"}}
</script></body></html>
