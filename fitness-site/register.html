<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إنشاء حساب | جمال موسى FITNESS</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="nav"><div class="navin"><a class="logo" href="index.html">جمال موسى <span>FITNESS</span></a><a class="btn" href="index.html">الرئيسية</a></div></header><main class="container"><section class="formbox reveal"><h1>إنشاء حساب</h1><div class="field"><label>الاسم</label><input id="name" class="input"></div><div class="field"><label>البريد الإلكتروني</label><input id="email" class="input"></div><div class="field"><label>كلمة المرور</label><input id="pass" type="password" class="input"></div><button id="go" class="btn gold">إنشاء الحساب</button><div id="m" class="msg"></div></section></main><script src="assets/app.js"></script><script>
$("#go").onclick=async()=>{let m=$("#m");m.className="msg";try{await api("/api/register",{method:"POST",body:JSON.stringify({name:$("#name").value,email:$("#email").value,password:$("#pass").value})});m.textContent="تم إنشاء الحساب. يمكنك تسجيل الدخول.";m.className="msg ok";setTimeout(()=>location.href="login.html",800)}catch(e){m.textContent=e.message;m.className="msg err"}}
</script></body></html>
