<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التمرين | جمال موسى FITNESS</title><link rel="stylesheet" href="assets/style.css"></head><body>
<header class="nav"><div class="navin"><a class="logo" href="index.html">جمال موسى <span>FITNESS</span></a><nav class="links"><a href="index.html">الرئيسية</a><a href="plans.html">الاشتراكات</a><a href="workouts.html">التمارين</a><a href="programs.html">البرامج</a><a href="contact.html">الدعم</a></nav></div></header><main class="container"><div id="detail"></div></main><footer>© <span id="year"></span> جمال موسى FITNESS</footer><script src="assets/app.js"></script><script>
(async()=>{let id=new URLSearchParams(location.search).get("id");let s=await site();let w=(s.workouts||[]).find(x=>String(x.id)===String(id));if(!w){$("#detail").innerHTML='<section class="pagehead"><h1>التمرين غير موجود</h1><a class="btn gold" href="workouts.html">العودة للتمارين</a></section>';return}
$("#detail").innerHTML=`<section class="detail"><div class="media reveal">${w.image?`<img src="${esc(w.image)}" alt="${esc(w.title)}">`:'<div class="big">🏋️</div>'}</div><article class="panel reveal"><span class="tag gold">${esc((w.planId||"free").toUpperCase())}</span><h1>${esc(w.title)}</h1><p>${esc(w.description||"")}</p><div class="meta"><span class="tag">${esc(w.level||"عام")}</span><span class="tag">${esc(w.muscles||"عضلات متعددة")}</span></div><h2>المجموعات والتكرارات</h2><p>${esc(w.sets||"—")} مجموعات × ${esc(w.reps||"—")}</p><h2>الراحة</h2><p>${esc(w.rest||"—")}</p><h2>طريقة الأداء</h2><p>${esc(w.howTo||"سيتم إضافة الشرح.")}</p><h2>أخطاء شائعة</h2><p>${esc(w.mistakes||"—")}</p>${w.video?`<p style="margin-top:20px"><a class="btn gold" href="${esc(w.video)}" target="_blank" rel="noopener">🎬 مشاهدة الفيديو</a></p>`:""}</article></section>`;reveal()})()
</script></body></html>
