<main class="container"><section class="pagehead reveal"><h1>مكتبة التمارين</h1><p>اختر أي تمرين لفتح صفحته الكاملة.</p></section><div class="toolbar"><input id="q" class="input" placeholder="ابحث عن تمرين..."></div><section class="grid" id="list"></section></main><footer>© <span id="year"></span> جمال موسى FITNESS</footer><script src="assets/app.js"></script><script>
let all=[];function render(){let q=$("#q").value.trim().toLowerCase();let a=all.filter(w=>(w.title||"").toLowerCase().includes(q));$("#list").innerHTML=a.map(w=>`<a class="card workout-card reveal" href="workout.html?id=${encodeURIComponent(w.id)}"><div class="thumb">${w.image?`<img src="${esc(w.image)}" alt="${esc(w.title)}">`:"<span>🏋️</span>"}</div><div class="body"><h3>${esc(w.title)}</h3><div class="meta"><span class="tag gold">${esc((w.planId||"free").toUpperCase())}</span><span class="tag">${esc(w.level||"عام")}</span></div><p>${esc(w.description||"تمرين تدريبي")}</p></div></a>`).join("")||'<div class="panel">لا توجد نتائج.</div>';reveal()}(async()=>{let s=await site();all=s.workouts||[];render();$("#q").addEventListener("input",render)})()
