<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول | جمال موسى FITNESS</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="nav"><div class="navin"><a class="logo" href="index.html">جمال موسى <span>FITNESS</span></a><a class="btn" href="index.html">الرئيسية</a></div></header><main class="container"><section class="formbox reveal"><h1>تسجيل الدخول</h1><div class="field"><label>البريد الإلكتروني أو اسم المستخدم</label><input id="u" class="input"></div><div class="field"><label>كلمة المرور</label><input id="p" type="password" class="input"></div><button id="go" class="btn gold">دخول</button><div id="m" class="msg"></div><p style="text-align:center;color:var(--muted);margin-top:18px">ليس لديك حساب؟ <a href="register.html" style="color:var(--gold)">إنشاء حساب</a></p></section></main><script src="assets/app.js"></script><script>
$("#go").onclick=async()=>{let m=$("#m");m.className="msg";try{await api("/api/login",{method:"POST",body:JSON.stringify({username:$("#u").value,email:$("#u").value,password:$("#p").value})});location.href="account.html"}catch(e){m.textContent=e.message;m.className="msg err"}}
</script></body></html>
